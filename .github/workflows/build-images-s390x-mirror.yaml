name: Build s390x mirror image (thanos)

# Builds only the linux/s390x leg of the Thanos image under QEMU emulation, then
# folds it together with upstream's prebuilt linux/amd64 + linux/arm64 +
# linux/ppc64le image into a multiarch manifest published under ghcr.io/dnse-tech.
# Upstream layers are never rebuilt -- only re-referenced -- so those three
# manifests stay byte for byte the official Thanos release.
#
# The Go binary is cross-compiled on the amd64 runner with promu (the same tool
# and flags upstream uses for its releases), so QEMU only has to run the few
# adduser/chown commands of the final Dockerfile.multi-arch stage.
# Note: Dockerfile.multi-stage cannot be used -- at v0.40.1 it still pins
# golang:1.24.0 while go.mod requires >= 1.25.0.

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Thanos release version to mirror (must exist upstream, e.g. v0.40.1)"
        required: true
        default: "v0.40.1"
  push:
    tags:
      # e.g. v0.40.1-s390x
      - "v[0-9]+.[0-9]+.[0-9]+-s390x"

permissions:
  contents: read
  packages: write

env:
  UPSTREAM_REGISTRY: quay.io/thanos
  TARGET_REGISTRY: ghcr.io/dnse-tech
  IMAGE: thanos

jobs:
  mirror-s390x:
    name: Build s390x and merge with upstream
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version
        id: ver
        run: |
          set -euo pipefail
          v="${{ github.event.inputs.version }}"
          [ -z "$v" ] && v="${GITHUB_REF_NAME%-s390x}"
          case "$v" in v[0-9]*) ;; *) echo "bad version: $v" >&2; exit 1 ;; esac
          # GHCR tags are published without the leading "v" (matches 0.39.2).
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "tag=${v#v}" >> "$GITHUB_OUTPUT"

      - name: Resolve busybox base digest for s390x
        id: base
        run: |
          set -euo pipefail
          # .busybox-versions pins per-arch digests, but quay prunes old ones
          # (every digest in the v0.40.1 file 404s as of this writing), so fall
          # back to the current s390x child of busybox:latest.
          sha=$(grep '^s390x=' .busybox-versions | cut -d= -f2)
          if ! docker buildx imagetools inspect "quay.io/prometheus/busybox@sha256:${sha}" >/dev/null 2>&1; then
            echo "pinned s390x busybox digest ${sha} is gone from quay; resolving :latest"
            sha=$(docker buildx imagetools inspect --raw quay.io/prometheus/busybox:latest \
              | jq -r '.manifests[] | select(.platform.architecture=="s390x") | .digest' | sed 's/^sha256://')
          fi
          [ -n "$sha" ]
          echo "Using busybox s390x base sha256:${sha}"
          echo "base_sha=${sha}" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU (s390x emulation)
        uses: docker/setup-qemu-action@v3
        with:
          platforms: s390x

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Cross-compile thanos for linux/s390x
        run: |
          set -euo pipefail
          # promu version is the one pinned in .bingo/promu.mod
          go install github.com/prometheus/promu@v0.17.0
          "$(go env GOPATH)/bin/promu" crossbuild -v -p linux/s390x
          file .build/linux-s390x/thanos

      - name: Build and push s390x image
        env:
          TAG: ${{ steps.ver.outputs.tag }}
          BASE_SHA: ${{ steps.base.outputs.base_sha }}
        run: |
          set -euo pipefail
          docker buildx build \
            --platform linux/s390x \
            --provenance=false --sbom=false \
            -f Dockerfile.multi-arch \
            --build-arg "BASE_DOCKER_SHA=${BASE_SHA}" \
            --build-arg ARCH=s390x \
            --build-arg OS=linux \
            -t "${TARGET_REGISTRY}/${IMAGE}:${TAG}-s390x" \
            --push .

      - name: Create multiarch manifest (upstream legs + our s390x)
        env:
          VERSION: ${{ steps.ver.outputs.version }}
          TAG: ${{ steps.ver.outputs.tag }}
        run: |
          set -euo pipefail
          # imagetools create copies upstream's amd64/arm64/ppc64le manifests and
          # our s390x manifest into one multiarch list in the target repo.
          # Upstream images are re-referenced, never rebuilt.
          docker buildx imagetools create \
            -t "${TARGET_REGISTRY}/${IMAGE}:${TAG}" \
            "${UPSTREAM_REGISTRY}/${IMAGE}:${VERSION}" \
            "${TARGET_REGISTRY}/${IMAGE}:${TAG}-s390x"

          digest=$(docker buildx imagetools inspect \
            "${TARGET_REGISTRY}/${IMAGE}:${TAG}" \
            --format '{{json .Manifest.Digest}}' | tr -d '"')
          echo "${TARGET_REGISTRY}/${IMAGE}:${TAG}@${digest}" \
            | tee image-digest-${IMAGE}-${TAG}.txt

      - name: Verify upstream children are byte-identical
        env:
          VERSION: ${{ steps.ver.outputs.version }}
          TAG: ${{ steps.ver.outputs.tag }}
        run: |
          set -euo pipefail
          up=$(docker buildx imagetools inspect --raw "${UPSTREAM_REGISTRY}/${IMAGE}:${VERSION}" \
            | jq -S '[.manifests[] | {p: (.platform.os+"/"+.platform.architecture), d: .digest}] | sort_by(.p)')
          ours=$(docker buildx imagetools inspect --raw "${TARGET_REGISTRY}/${IMAGE}:${TAG}" \
            | jq -S '[.manifests[] | select(.platform.architecture != "s390x")
                      | {p: (.platform.os+"/"+.platform.architecture), d: .digest}] | sort_by(.p)')
          echo "upstream: $up"
          echo "ours:     $ours"
          [ "$up" = "$ours" ] || { echo "upstream child digests drifted!" >&2; exit 1; }
          docker buildx imagetools inspect --raw "${TARGET_REGISTRY}/${IMAGE}:${TAG}" \
            | jq -e '[.manifests[].platform.architecture] | index("s390x")' >/dev/null

      - name: Upload image digest
        uses: actions/upload-artifact@v4
        with:
          name: image-digest-thanos-s390x-mirror
          path: image-digest-*.txt
