name: Build s390x mirror image (thanos)

# Builds only the linux/s390x leg of the Thanos image under QEMU emulation, then
# folds it together with upstream's prebuilt linux/amd64 + linux/arm64 +
# linux/ppc64le image into a multiarch manifest published under ghcr.io/dnse-tech.
# Upstream layers are never rebuilt -- only re-referenced -- so those three
# manifests stay byte for byte the official Thanos release.
#
# Dockerfile.multi-stage's builder stage is not pinned to BUILDPLATFORM, so the
# Go compile runs under s390x emulation (~35 min for the whole image).

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Thanos release version to mirror (must exist upstream, e.g. v0.40.1)"
        required: true
        default: "v0.40.1"
  push:
    tags:
      # e.g. v0.40.1-s390x
      - "v[0-9]+.[0-9]+.[0-9]+-s390x"

permissions:
  contents: read
  packages: write

env:
  UPSTREAM_REGISTRY: quay.io/thanos
  TARGET_REGISTRY: ghcr.io/dnse-tech
  IMAGE: thanos

jobs:
  mirror-s390x:
    name: Build s390x and merge with upstream
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version
        id: ver
        run: |
          set -euo pipefail
          v="${{ github.event.inputs.version }}"
          [ -z "$v" ] && v="${GITHUB_REF_NAME%-s390x}"
          case "$v" in v[0-9]*) ;; *) echo "bad version: $v" >&2; exit 1 ;; esac
          # GHCR tags are published without the leading "v" (matches 0.39.2).
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "tag=${v#v}" >> "$GITHUB_OUTPUT"
          # busybox base image digest for the s390x leg
          echo "base_sha=$(grep '^s390x=' .busybox-versions | cut -d= -f2)" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU (s390x emulation)
        uses: docker/setup-qemu-action@v3
        with:
          platforms: s390x

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push s390x image
        env:
          TAG: ${{ steps.ver.outputs.tag }}
          BASE_SHA: ${{ steps.ver.outputs.base_sha }}
        run: |
          set -euo pipefail
          docker buildx build \
            --platform linux/s390x \
            --provenance=false --sbom=false \
            -f Dockerfile.multi-stage \
            --build-arg "BASE_DOCKER_SHA=${BASE_SHA}" \
            -t "${TARGET_REGISTRY}/${IMAGE}:${TAG}-s390x" \
            --cache-from type=gha,scope=s390x \
            --cache-to type=gha,mode=max,scope=s390x \
            --push .

      - name: Create multiarch manifest (upstream legs + our s390x)
        env:
          VERSION: ${{ steps.ver.outputs.version }}
          TAG: ${{ steps.ver.outputs.tag }}
        run: |
          set -euo pipefail
          # imagetools create copies upstream's amd64/arm64/ppc64le manifests and
          # our s390x manifest into one multiarch list in the target repo.
          # Upstream images are re-referenced, never rebuilt.
          docker buildx imagetools create \
            -t "${TARGET_REGISTRY}/${IMAGE}:${TAG}" \
            "${UPSTREAM_REGISTRY}/${IMAGE}:${VERSION}" \
            "${TARGET_REGISTRY}/${IMAGE}:${TAG}-s390x"

          digest=$(docker buildx imagetools inspect \
            "${TARGET_REGISTRY}/${IMAGE}:${TAG}" \
            --format '{{json .Manifest.Digest}}' | tr -d '"')
          echo "${TARGET_REGISTRY}/${IMAGE}:${TAG}@${digest}" \
            | tee image-digest-${IMAGE}-${TAG}.txt

      - name: Verify upstream children are byte-identical
        env:
          VERSION: ${{ steps.ver.outputs.version }}
          TAG: ${{ steps.ver.outputs.tag }}
        run: |
          set -euo pipefail
          up=$(docker buildx imagetools inspect --raw "${UPSTREAM_REGISTRY}/${IMAGE}:${VERSION}" \
            | jq -S '[.manifests[] | {p: (.platform.os+"/"+.platform.architecture), d: .digest}] | sort_by(.p)')
          ours=$(docker buildx imagetools inspect --raw "${TARGET_REGISTRY}/${IMAGE}:${TAG}" \
            | jq -S '[.manifests[] | select(.platform.architecture != "s390x")
                      | {p: (.platform.os+"/"+.platform.architecture), d: .digest}] | sort_by(.p)')
          echo "upstream: $up"
          echo "ours:     $ours"
          [ "$up" = "$ours" ] || { echo "upstream child digests drifted!" >&2; exit 1; }
          docker buildx imagetools inspect --raw "${TARGET_REGISTRY}/${IMAGE}:${TAG}" \
            | jq -e '[.manifests[].platform.architecture] | index("s390x")' >/dev/null

      - name: Upload image digest
        uses: actions/upload-artifact@v4
        with:
          name: image-digest-thanos-s390x-mirror
          path: image-digest-*.txt
